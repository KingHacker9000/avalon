name: Apply mobile lobby fix

on:
  push:
    branches:
      - 'fix/mobile-lobby-flow'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused mobile, lobby, and invite fixes
        run: python3 .github/scripts/apply-mobile-lobby-fix.py

      - name: Validate changes
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-lobby-fix.yml .github/scripts/apply-mobile-lobby-fix.py
          git add app/page.tsx app/layout.tsx app/mobile-lobby-fix.css components/game-table.tsx lib/game/engine.ts tests/engine.test.ts
          git commit -m "Fix mobile portraits and auto-sizing lobby flow"
          git push origin HEAD:fix/mobile-lobby-flow
