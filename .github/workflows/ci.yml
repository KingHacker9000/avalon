name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: API smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          data_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/avalon-api-smoke.log"
          AVALON_DATA_DIR="$data_dir" npm start >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$data_dir"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          if ! AVALON_TEST_URL=http://127.0.0.1:4173 node tests/api-smoke.mjs; then
            cat "$log_file"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AVALON_AUTODEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: avalon-production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${LIGHTSAIL_HOST:?Missing LIGHTSAIL_HOST secret}"
          : "${LIGHTSAIL_USER:?Missing LIGHTSAIL_USER secret}"
          : "${LIGHTSAIL_SSH_KEY:?Missing LIGHTSAIL_SSH_KEY secret}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?Missing LIGHTSAIL_KNOWN_HOSTS secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$HOME/.ssh/avalon_deploy"
          chmod 600 "$HOME/.ssh/avalon_deploy"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested revision
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/avalon_deploy" \
            -o BatchMode=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "set -e; git -C /srv/avalon/repo fetch --prune origin main; git -C /srv/avalon/repo reset --hard '$GITHUB_SHA'; bash /srv/avalon/repo/deploy/deploy.sh '$GITHUB_SHA'"
