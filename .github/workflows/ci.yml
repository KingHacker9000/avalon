name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: bash -n deploy/deploy.sh deploy/pi/deploy-avalon-worker deploy/lightsail/deploy-avalon-relay

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: API smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          data_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/avalon-api-smoke.log"
          AVALON_DATA_DIR="$data_dir" npm start >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$data_dir"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          if ! AVALON_TEST_URL=http://127.0.0.1:4173 node tests/api-smoke.mjs; then
            cat "$log_file"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AVALON_AUTODEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: avalon-production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ vars.AVALON_LIGHTSAIL_HOST }}
      LIGHTSAIL_SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - name: Configure restricted Lightsail SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${LIGHTSAIL_HOST:?Missing AVALON_LIGHTSAIL_HOST repository variable}"
          : "${LIGHTSAIL_SSH_KEY_B64:?Missing LIGHTSAIL_SSH_KEY_B64 secret}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?Missing LIGHTSAIL_KNOWN_HOSTS secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$LIGHTSAIL_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/avalon_deploy"
          chmod 600 "$HOME/.ssh/avalon_deploy"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested revision to Raspberry Pi
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/avalon_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ClearAllForwardings=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ubuntu@"$LIGHTSAIL_HOST" \
            "deploy $GITHUB_SHA"
