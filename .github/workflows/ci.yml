name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AVALON_AUTODEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: avalon-production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${LIGHTSAIL_HOST:?Missing LIGHTSAIL_HOST secret}"
          : "${LIGHTSAIL_USER:?Missing LIGHTSAIL_USER secret}"
          : "${LIGHTSAIL_SSH_KEY:?Missing LIGHTSAIL_SSH_KEY secret}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?Missing LIGHTSAIL_KNOWN_HOSTS secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$HOME/.ssh/avalon_deploy"
          chmod 600 "$HOME/.ssh/avalon_deploy"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested revision
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/avalon_deploy" \
            -o BatchMode=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "set -e; git -C /srv/avalon/repo fetch --prune origin main; git -C /srv/avalon/repo reset --hard '$GITHUB_SHA'; bash /srv/avalon/repo/deploy/deploy.sh '$GITHUB_SHA'"
